name: Deploy Devasriya Print to Firebase Hosting

# Production. The frontend is served by Firebase Hosting; everything behind it -
# database, auth, storage - is Supabase. Only the publishable anon key is built
# into the bundle: the service role key belongs to Edge Functions and nowhere
# else, and must never appear in this workflow.
on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: 'hosting'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify
        env:
          VITE_DEMO_MODE: 'false'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
