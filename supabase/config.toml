# Local Supabase stack for Devasriya Print. `supabase start` needs Docker.
project_id = "devasriya-print"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

# Accounts are created by the provision-account Edge Function, by a staff member
# who already holds the right permission. Nobody signs themselves up.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true

[edge_runtime]
enabled = true

[functions.provision-account]
verify_jwt = true
